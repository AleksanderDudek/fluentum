<!doctype html>
<html lang="pl" data-font="md">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Fluentum – rozmowy na głos / speak a new language</title>
    <meta
      name="description"
      content="Krótkie rozmowy po angielsku (lub po polsku) – na głos. Fluentum sprawdza każde zdanie, a gwiazdki, seria dni i punkty pokazują postępy. Za darmo, prywatnie, na Twoim urządzeniu."
    />
    <meta name="theme-color" content="#eef4f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a1a1c" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Fluentum" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180x180.png" />
    <style>
      /* Boot splash, replaced by React once the local database is ready. */
      .boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #eef4f1;
        color: #0b6b66;
        font: 600 1.35rem/1 system-ui, sans-serif;
        letter-spacing: 0.32em;
      }
      .boot span {
        opacity: 0;
        animation: boot-in 0.8s 0.2s ease-out forwards;
      }
      @keyframes boot-in {
        to {
          opacity: 0.85;
        }
      }
      @media (prefers-color-scheme: dark) {
        .boot {
          background: #0a1a1c;
          color: #46d0c2;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot" aria-hidden="true"><span>FLUENTUM</span></div></div>
    <noscript>Fluentum wymaga JavaScriptu. / Fluentum requires JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
